# Local testing services: Postgres + Mailpit (catches magic-link emails).
# Usage: docker compose up -d
# Bound to 127.0.0.1: Mailpit shows every sign-in email, it must not be reachable from the LAN.
#   Postgres  -> localhost:5432 (collector / collector / collector)
#   Mailpit   -> SMTP localhost:1025, web UI http://localhost:8025

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-collector}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-collector}
      POSTGRES_DB: ${DB_NAME:-collector}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
