<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Books, records, films and games: your physical collection in one place." />
    <meta name="theme-color" content="#111113" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Collector" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Collector</title>
    <!-- Splash: painted before any script runs, faded out by the app once it is ready (lib/splash.js) -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 18px;
        background: #111113; color: var(--accent, #b26ee0); transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash svg {
        width: 64px; height: 64px; color: color-mix(in oklab, currentColor 72%, white);
        filter: drop-shadow(0 0 1px currentColor) drop-shadow(0 0 6px currentColor) drop-shadow(0 0 18px currentColor);
        animation: splash-on 1s steps(1, end) both, splash-breathe 2.4s ease-in-out 1s infinite;
      }
      #splash .name {
        font-family: 'Tilt Neon', system-ui, sans-serif; font-size: 30px; letter-spacing: 0.01em;
        color: color-mix(in oklab, currentColor 22%, white);
        text-shadow: 0 0 2px currentColor, 0 0 12px currentColor;
        animation: splash-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
      }
      #splash .line {
        width: 120px; height: 2px; border-radius: 2px; overflow: hidden;
        background: color-mix(in oklab, currentColor 18%, transparent);
      }
      #splash .line::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: inherit;
        background: currentColor; box-shadow: 0 0 8px currentColor;
        animation: splash-scan 1.1s ease-in-out infinite;
      }
      @keyframes splash-on { 0% { opacity: 0.1 } 12% { opacity: 1 } 18% { opacity: 0.3 } 30% { opacity: 1 } 36% { opacity: 0.55 } 44%, 100% { opacity: 1 } }
      @keyframes splash-breathe { 50% { opacity: 0.8 } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(6px) } }
      @keyframes splash-scan { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) #splash { background: #f5f5f6; }
        :root:not([data-theme='dark']) #splash .name { color: color-mix(in oklab, currentColor 65%, #18181b); text-shadow: 0 0 8px color-mix(in oklab, currentColor 30%, transparent); }
      }
      :root[data-theme='light'] #splash { background: #f5f5f6; }
      :root[data-theme='light'] #splash .name { color: color-mix(in oklab, currentColor 65%, #18181b); text-shadow: 0 0 8px color-mix(in oklab, currentColor 30%, transparent); }
      @media (prefers-reduced-motion: reduce) {
        #splash svg, #splash .name, #splash .line::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2" />
        <circle cx="10" cy="8" r="2" />
        <circle cx="10" cy="16" r="2" />
        <path d="M12 8v8" />
        <path d="M20 6l-2.6.7a1.4 1.4 0 0 0-1.1 1.4v7.8a1.4 1.4 0 0 0 1.1 1.4L20 18" />
      </svg>
      <span class="name">Collector</span>
      <span class="line"></span>
    </div>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
